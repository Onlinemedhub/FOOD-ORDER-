<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>घर का स्वाद किचन | Ghar Ka Swad Kitchen</title>
    <!-- Self-contained, zero-dependency CSS for instant & reliable rendering -->
    <style>
        :root {
            --primary: #ea580c;
            --primary-dark: #c2410c;
            --primary-light: #fff7ed;
            --maroon: #431407;
            --bg-cream: #fffbf5;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #fed7aa;
            --veg-green: #16a34a;
            --nonveg-red: #dc2626;
            --whatsapp: #25d366;
            --whatsapp-dark: #1ebe5d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-cream);
            background-image: radial-gradient(#fed7aa 0.8px, transparent 0.8px);
            background-size: 20px 20px;
            color: var(--text-dark);
            line-height: 1.5;
            padding-bottom: 110px;
        }

        /* ==================== HEADER ==================== */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(135deg, var(--maroon) 0%, #9a3412 50%, var(--primary) 100%);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(67, 20, 7, 0.25);
        }

        .header-inner {
            max-width: 820px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.16);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-fresh {
            background: #fde047;
            color: var(--maroon);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 99px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.76rem;
            color: #ffedd5;
            opacity: 0.95;
        }

        .qr-btn {
            background: #ffffff;
            color: var(--primary-dark);
            border: none;
            padding: 9px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s ease, background 0.15s ease;
            flex-shrink: 0;
        }

        .qr-btn:active {
            transform: scale(0.95);
        }

        /* ==================== STATUS STRIP ==================== */
        .status-strip {
            background: #ffedd5;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--maroon);
        }

        .status-inner {
            max-width: 820px;
            margin: 0 auto;
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .live-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: var(--veg-green);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.25);
        }

        /* ==================== MAIN CONTAINER ==================== */
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 18px 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .pill-tag {
            display: inline-block;
            background: #ffedd5;
            color: var(--primary-dark);
            font-size: 0.7rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 99px;
            margin-bottom: 4px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--maroon);
        }

        /* ==================== FILTER TABS ==================== */
        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 8px 15px;
            border-radius: 99px;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            color: var(--text-dark);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, #dc2626 100%);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.28);
        }

        /* ==================== MENU GRID & CARDS ==================== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        @media (min-width: 600px) {
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .menu-card {
            background: var(--card-bg);
            border: 1.5px solid #fde68a;
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(67, 20, 7, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .menu-card.selected {
            border-color: var(--primary);
            background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
            box-shadow: 0 6px 18px rgba(234, 88, 12, 0.16);
        }

        .menu-card.hidden-item {
            display: none;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .dish-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .diet-icon {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .diet-veg {
            border: 1.5px solid var(--veg-green);
            background: #f0fdf4;
        }
        .diet-veg::after {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--veg-green);
        }
        .diet-nonveg {
            border: 1.5px solid var(--nonveg-red);
            background: #fef2f2;
        }
        .diet-nonveg::after {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--nonveg-red);
        }

        .dish-name-hi {
            font-size: 1.08rem;
            font-weight: 800;
            color: #0f172a;
        }

        .dish-name-en {
            display: inline-block;
            margin-top: 3px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--primary-dark);
            background: var(--primary-light);
            border: 1px solid #fed7aa;
            padding: 1px 8px;
            border-radius: 6px;
        }

        .dish-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .dish-emoji {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            border: 1px solid #fed7aa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .card-bottom {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price-badge {
            background: #fef3c7;
            border: 1.5px solid #fcd34d;
            padding: 4px 11px;
            border-radius: 12px;
            display: inline-flex;
            align-items: baseline;
            gap: 3px;
        }

        .price-num {
            font-size: 1.12rem;
            font-weight: 800;
            color: #b91c1c;
        }

        .price-unit {
            font-size: 0.76rem;
            font-weight: 700;
            color: #78350f;
        }

        /* Quantity Controls [- 0 +] */
        .qty-box {
            display: inline-flex;
            align-items: center;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 3px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 9px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .qty-btn:active {
            transform: scale(0.9);
        }

        .qty-minus {
            background: #ffffff;
            color: #334155;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .qty-plus {
            background: linear-gradient(135deg, var(--primary), #dc2626);
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(234, 88, 12, 0.3);
        }

        .qty-val {
            width: 34px;
            text-align: center;
            font-weight: 800;
            font-size: 0.92rem;
            color: #1e293b;
        }

        .qty-val.active {
            color: var(--primary-dark);
        }

        /* ==================== CUSTOM ORDER BOX ==================== */
        .custom-box {
            background: linear-gradient(180deg, #ffffff 0%, #fffbeb 100%);
            border: 2px dashed var(--primary);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 22px;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.06);
        }

        .custom-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .custom-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #dc2626);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tag-chip {
            background: #ffffff;
            border: 1px solid #fdba74;
            color: #9a3412;
            font-size: 0.74rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .tag-chip:hover {
            background: #ffedd5;
        }

        .form-textarea, .form-input {
            width: 100%;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 0.9rem;
            color: #0f172a;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-textarea:focus, .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
        }

        /* ==================== CHECKOUT FORM ==================== */
        .checkout-card {
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 4px 14px rgba(67, 20, 7, 0.06);
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 5px;
        }

        .receipt-box {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 14px;
            padding: 13px;
            margin-bottom: 15px;
            display: none;
        }

        .receipt-box.visible {
            display: block;
        }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--maroon);
            padding-bottom: 8px;
            border-bottom: 1px dashed #fdba74;
            margin-bottom: 8px;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #dc2626;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }

        .receipt-list {
            list-style: none;
            font-size: 0.83rem;
        }

        .receipt-list li {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .receipt-total-row {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1.5px solid #fdba74;
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 1rem;
            color: var(--maroon);
        }

        .whatsapp-btn {
            width: 100%;
            background: var(--whatsapp);
            color: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
            transition: background 0.2s, transform 0.1s;
        }

        .whatsapp-btn:hover {
            background: var(--whatsapp-dark);
        }

        .whatsapp-btn:active {
            transform: scale(0.98);
        }

        /* ==================== STICKY BOTTOM CART BAR ==================== */
        .sticky-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 45;
            background: #1e293b;
            color: #ffffff;
            border-top: 1px solid #334155;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);
            transition: transform 0.28s ease;
        }

        .sticky-bar.visible {
            transform: translateY(0);
        }

        .sticky-inner {
            max-width: 820px;
            margin: 0 auto;
            padding: 11px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .cart-badge-wrap {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .cart-icon-box {
            position: relative;
            background: var(--primary);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .cart-count-pill {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ffffff;
            color: var(--primary-dark);
            font-size: 0.72rem;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .sticky-actions {
            display: flex;
            gap: 8px;
        }

        .btn-scroll-form {
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 11px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .btn-sticky-wa {
            background: var(--whatsapp);
            color: #ffffff;
            border: none;
            padding: 9px 14px;
            border-radius: 11px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
        }

        /* ==================== TOAST & QR MODAL ==================== */
        .toast {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            background: #0f172a;
            color: #ffffff;
            padding: 11px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            display: none;
            align-items: center;
            gap: 8px;
            max-width: 92%;
        }

        .toast.show {
            display: flex;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 70;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 24px;
            max-width: 360px;
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
